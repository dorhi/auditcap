server {
    listen 80;
    server_name auditcap.sae-a.com localhost;

    # 파일 업로드 용량 제한 (Spring Boot multipart 설정과 일치: 50MB)
    client_max_body_size 50M;

    # 매뉴얼 및 정적 PPT 다운로드 경로 (파일 부재 시 index.html SPA rewrite 방지 및 올바른 다운로드 보장)
    location /manuals/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # 프론트엔드 React SPA 서빙
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 백엔드 API 호출을 Docker 내부 네트워크의 backend 컨테이너로 프록시
    location /api/ {
        proxy_pass http://backend:8788/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 파일 업로드/다운로드 타임아웃 방지 (300초)
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
