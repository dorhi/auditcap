services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auditcap-backend
    restart: always
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - APP_UPLOAD_PATH=/app/uploads
      - APP_MANUAL_PATH=/data/auditcap/SAE-A_CAP_Integrated_Manual.pptx
      - SPRING_JPA_SHOW_SQL=false
    volumes:
      # 호스트 서버(/data/auditcap)에 증빙자료 및 통합 매뉴얼 파일을 영구 보존하기 위한 볼륨 마운트
      - /data/auditcap:/data/auditcap
      - /data/auditcap:/app/uploads
    networks:
      - auditcap-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: auditcap-frontend
    restart: always
    ports:
      # 기존 운영 중인 다른 Docker 컨테이너와의 포트 충돌 방지 (기본 8787 포트, 필요시 .env의 WEB_PORT로 변경 가능)
      - "${WEB_PORT:-8787}:80"
    depends_on:
      - backend
    networks:
      - auditcap-net

networks:
  auditcap-net:
    driver: bridge
